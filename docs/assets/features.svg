<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Six principles of Noctiluca"><title>Six principles of Noctiluca</title><rect width="1280" height="520" fill="#08090b"/><rect x="20" y="10" width="392" height="236" rx="22" fill="#0d1013" stroke="#e6e3da" stroke-opacity="0.12"/><g transform="translate(50 40)" fill="none" stroke="#c9cfd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="12"/><circle cx="14" cy="14" r="6"/><circle cx="14" cy="14" r="1.5" fill="#c9cfd2"/></g><text x="50" y="114" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="32" fill="#e6e3da" text-anchor="start" letter-spacing="0" font-weight="400" font-style="italic">Right difficulty</text><text x="50" y="152" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >Aims for about 72% predicted success.</text><text x="50" y="178" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >Hard enough to stretch, never so hard</text><text x="50" y="204" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >you stall.</text><text x="382" y="46" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#565f64" text-anchor="end" letter-spacing="2" font-weight="500" >01</text><rect x="434" y="10" width="392" height="236" rx="22" fill="#0d1013" stroke="#e6e3da" stroke-opacity="0.12"/><g transform="translate(464 40)" fill="none" stroke="#c9cfd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18c4-12 6-12 8 0s4 12 8 0 4-12 8-3"/></g><text x="464" y="114" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="32" fill="#e6e3da" text-anchor="start" letter-spacing="0" font-weight="400" font-style="italic">Never repeats</text><text x="464" y="152" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >Prompt hashes, family cooldowns and</text><text x="464" y="178" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >endless seeded drill variants. Swap</text><text x="464" y="204" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >twice per descent.</text><text x="796" y="46" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#565f64" text-anchor="end" letter-spacing="2" font-weight="500" >02</text><rect x="848" y="10" width="392" height="236" rx="22" fill="#0d1013" stroke="#e6e3da" stroke-opacity="0.12"/><g transform="translate(878 40)" fill="none" stroke="#c9cfd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a10 10 0 0 1 18-5M24 14a10 10 0 0 1-18 5"/><path d="M22 3v6h-6M6 25v-6h6"/></g><text x="878" y="114" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="32" fill="#e6e3da" text-anchor="start" letter-spacing="0" font-weight="400" font-style="italic">Spaced review</text><text x="878" y="152" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >Leitner intervals of 0, 1, 3, 7, 16 and</text><text x="878" y="178" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >35 days bring old ideas back right on</text><text x="878" y="204" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >time.</text><text x="1210" y="46" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#565f64" text-anchor="end" letter-spacing="2" font-weight="500" >03</text><rect x="20" y="266" width="392" height="236" rx="22" fill="#0d1013" stroke="#e6e3da" stroke-opacity="0.12"/><g transform="translate(50 296)" fill="none" stroke="#c9cfd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2l11 6v12l-11 6-11-6V8z"/><path d="M3 8l11 6 11-6M14 14v12"/></g><text x="50" y="370" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="32" fill="#e6e3da" text-anchor="start" letter-spacing="0" font-weight="400" font-style="italic">Real Python, in-browser</text><text x="50" y="408" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >Pyodide in a Web Worker. Write, debug</text><text x="50" y="434" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >and trace. Offline after the first run.</text><text x="382" y="302" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#565f64" text-anchor="end" letter-spacing="2" font-weight="500" >04</text><rect x="434" y="266" width="392" height="236" rx="22" fill="#0d1013" stroke="#e6e3da" stroke-opacity="0.12"/><g transform="translate(464 296)" fill="none" stroke="#c9cfd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2L5 16h8l-2 10 11-14h-8z"/></g><text x="464" y="370" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="32" fill="#e6e3da" text-anchor="start" letter-spacing="0" font-weight="400" font-style="italic">Honest progress</text><text x="464" y="408" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >Depth, XP, levels and streaks. Streak</text><text x="464" y="434" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >shields cover one missed day.</text><text x="796" y="302" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#565f64" text-anchor="end" letter-spacing="2" font-weight="500" >05</text><rect x="848" y="266" width="392" height="236" rx="22" fill="#0d1013" stroke="#e6e3da" stroke-opacity="0.12"/><g transform="translate(878 296)" fill="none" stroke="#c9cfd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="20" height="14" rx="3"/><path d="M9 12V8a5 5 0 0 1 10 0v4"/></g><text x="878" y="370" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="32" fill="#e6e3da" text-anchor="start" letter-spacing="0" font-weight="400" font-style="italic">Yours alone</text><text x="878" y="408" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >Everything lives on this device. Back up</text><text x="878" y="434" font-family="Jost, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3a8" text-anchor="start" letter-spacing="0" font-weight="400" >and restore with one tap.</text><text x="1210" y="302" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#565f64" text-anchor="end" letter-spacing="2" font-weight="500" >06</text></svg>